name: CI

on:
  push:
    branches: [main, master, 'fix/**', 'feat/**']
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify TypeScript types (lint)
        run: npm run lint

      - name: Audit catalogue integrity
        run: npm run validate:catalog

      - name: Run unit & backend integration tests
        run: npm test

      - name: Validate Compact Edition fidelity primitives
        run: npm run validate:fidelity

      - name: Build production bundle
        run: npm run build
